all:
  children:
    dev:
      hosts:
        localhost: # entry point if you deploy to your own machine
          ansible_connection: local
          ansible_host: 127.0.0.1
      vars:
        library_dir: "{{ playbook_dir }}/build/library"
        downloads_dir: "{{ playbook_dir }}/build/bookdrop"
        services_dir: "{{ playbook_dir }}/build/services"
        config_dir: "{{ playbook_dir }}/build/services/config"