---
- name: Ensure shelfmark config dir exists
  ansible.builtin.file:
    path: "{{ config_dir }}/shelfmark"
    state: directory
    owner: "{{ puid }}"
    group: "{{ pgid }}"
    mode: "0755"

- name: Ensure shelfmark service dir exists
  ansible.builtin.file:
    path: "{{ services_dir }}/shelfmark"
    state: directory
    mode: "0755"

- name: Render shelfmark non-secret env file
  ansible.builtin.template:
    src: templates/shelfmark.env.j2
    dest: "{{ services_dir }}/shelfmark/.env"
    owner: "{{ puid }}"
    group: "{{ pgid }}"
    mode: "0640"
  tags: config

- name: Start shelfmark container
  community.docker.docker_container:
    name: "{{ shelfmark.container_name }}"
    image: "{{ shelfmark.image }}"
    env_file: "{{ services_dir }}/shelfmark/.env"
    expose:
      - "{{ shelfmark.port }}"
    networks:
      - name: proxy
    restart_policy: unless-stopped
    volumes:
      - "{{ config_dir }}/shelfmark:/config"
      - "{{ downloads_dir }}/ebooks:/downloads"
      - "{{ downloads_dir }}:/downloads"
    state: started
    pull: always
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:{{ shelfmark.port }}/api/health || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 30s
