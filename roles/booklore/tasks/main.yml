---
- name: Ensure booklore data dir exists
  ansible.builtin.file:
    path: "{{ services_dir }}/booklore/data"
    state: directory
    owner: "{{ puid }}"
    group: "{{ pgid }}"
    mode: "0755"

- name: Ensure booklore service dir exists
  ansible.builtin.file:
    path: "{{ services_dir }}/booklore"
    state: directory
    mode: "0755"

- name: Render booklore non-secret env file
  ansible.builtin.template:
    src: templates/booklore.env.j2
    dest: "{{ services_dir }}/booklore/.env"
    owner: "{{ puid }}"
    group: "{{ pgid }}"
    mode: "0640"
  tags: config

- name: Start booklore container
  community.docker.docker_container:
    name: "{{ booklore.container_name }}"
    image: "{{ booklore.image }}"
    env_file: "{{ services_dir }}/booklore/.env"
    env:
      DATABASE_USERNAME: "{{ mariadb.db.user | string }}"
      DATABASE_PASSWORD: "{{ secrets.db.password | string }}"
    networks:
      - name: proxy
    volumes:
      - "{{ services_dir }}/booklore/data:/app/data"
      - "{{ library_dir }}/ebooks:/books"
      - "{{ downloads_dir }}:/bookdrop"
    expose:
      - "{{ booklore.port }}"
    restart_policy: unless-stopped
    state: started
    pull: always
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:{{ booklore.port }}/api/v1/healthcheck || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 30s
  no_log: true # Keep secret-bearing task logs redacted
