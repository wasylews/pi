- name: Bootstrap Raspberry Pi and deploy services
  hosts: all
  become: true

  vars_files:
    - group_vars/all.yml
    - group_vars/vault.yml

  roles:
    - docker
    - mariadb
    - booklore
    - shelfmark

  tasks:
    - name: (roles will handle service deployment)
      ansible.builtin.debug:
        msg: "Services are managed by roles: mariadb, booklore, shelfmark"
