- name: Bootstrap Raspberry Pi and deploy services
  hosts: all

  vars_files:
    - group_vars/all.yml
    - group_vars/vault.yml

  pre_tasks:
    - name: Ensure library directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
        owner: "{{ puid }}"
        group: "{{ pgid }}"
      loop:
        - "{{ library_dir }}"
        - "{{ library_dir }}/ebooks"
        - "{{ library_dir }}/audiobooks"
    
    - name: Ensure downloads directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
        owner: "{{ puid }}"
        group: "{{ pgid }}"
      loop:
        - "{{ downloads_dir }}"
        - "{{ downloads_dir }}/ebooks"
        - "{{ downloads_dir }}/audiobooks"

    - name: Ensure services directory exists
      ansible.builtin.file:
        path: "{{ services_dir }}"
        state: directory
        mode: "0755"

    - name: Ensure config directory exists
      ansible.builtin.file:
        path: "{{ config_dir }}"
        state: directory
        mode: "0755"

  roles:
    - docker
    - caddy
    - mariadb
    - booklore
    - audiobookshelf
    - shelfmark
    - qbittorrent
    - adguardhome

  tasks:
    - name: (roles will handle service deployment)
      ansible.builtin.debug:
        msg: "Services deployed on {{ inventory_hostname }}"
