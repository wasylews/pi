- name: Bootstrap Raspberry Pi and deploy services
  hosts: all

  vars_files:
    - group_vars/all.yml
    - group_vars/vault.yml

  roles:
    - docker
    - caddy
    - mariadb
    - booklore
    - shelfmark
    - adguardhome

  tasks:
    - name: (roles will handle service deployment)
      ansible.builtin.debug:
        msg: "Services deployed on {{ inventory_hostname }}"
