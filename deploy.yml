- name: Bootstrap Raspberry Pi and deploy services
  hosts: all

  vars_files:
    - group_vars/all.yml
    - group_vars/vault.yml

  pre_tasks:
  - name: Ensure library directory exists
    ansible.builtin.file:
      path: "{{ library_dir }}"
      state: directory
      mode: "0755"
      owner: "{{ puid }}"
      group: "{{ pgid }}"

  - name: Ensure downloads directory exists
    ansible.builtin.file:
      path: "{{ downloads_dir }}"
      state: directory
      mode: "0755"
      owner: "{{ puid }}"
      group: "{{ pgid }}"

  - name: Ensure services directory exists
    ansible.builtin.file:
      path: "{{ services_dir }}"
      state: directory
      mode: "0755"

  - name: Ensure config directory exists
    ansible.builtin.file:
      path: "{{ config_dir }}"
      state: directory
      mode: "0755"

  roles:
    - docker
    - caddy
    - mariadb
    - booklore
    - shelfmark
    - adguardhome

  tasks:
    - name: (roles will handle service deployment)
      ansible.builtin.debug:
        msg: "Services deployed on {{ inventory_hostname }}"
